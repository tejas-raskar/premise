[project]
name = "premise-memory"
version = "0.1.0"
description = "Revision-aware engineering memory for coding agents"
requires-python = ">=3.12,<3.15"
dependencies = [
  "falkordb==1.8.0",
  "fastapi==0.143.2",
  "httpx==0.28.1",
  "mcp==2.3.0",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/premise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
